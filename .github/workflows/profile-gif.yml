name: Build animated profile UI

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_profile_gif.py"
      - ".github/workflows/profile-gif.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pillow
      - run: python scripts/generate_profile_gif.py
      - name: Commit generated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-os.gif
          git diff --cached --quiet && exit 0
          git commit -m "build: generate animated terminal profile GIF"
          git push
