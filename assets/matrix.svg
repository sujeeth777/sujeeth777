 <text x="25" y="55">[01] DISCOVER</text><text x="245" y="55">[02] DESIGN</text><text x="465" y="55">[03] BUILD</text><text x="685" y="55">[04] BREAK</text><text x="905" y="55">[05] SHIP</text>
</g>
<g stroke="#00ff88" stroke-width="1" opacity=".2">
 <path d="M25 90H1175"/><path d="M25 130H1175"/><path d="M25 170H1175"/>
