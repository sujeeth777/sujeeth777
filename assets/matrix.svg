 <circle cx="85" cy="110" r="5"><animate attributeName="cx" values="85;1115;85" dur="7s" repeatCount="indefinite"/></circle>
 <circle cx="300" cy="150" r="4"><animate attributeName="cx" values="300;900;300" dur="4.5s" repeatCount="indefinite"/></circle>
